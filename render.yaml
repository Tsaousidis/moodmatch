services:
  - type: web
    runtime: node
    name: moodmatch
    repo: https://github.com/Tsaousidis/moodmatch
    branch: main
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AZURE_AI_ENDPOINT
        sync: false
      - key: AZURE_AI_API_KEY
        sync: false
      - key: AZURE_AI_DEPLOYMENT
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: BOARDGAMEGEEK_API_BASE_URL
        value: https://boardgamegeek.com/xmlapi2
